<svg xmlns="http://www.w3.org/2000/svg"
     width="96"
     height="96"
     viewBox="0 0 96 96"
     role="img"
     aria-labelledby="title desc">
  <title id="title">KitchenBots icon</title>
  <desc id="desc">A black connected-node symbol on a pale green square.</desc>

  <rect width="96" height="96" rx="16" fill="#C7F0C6"/>

  <g fill="#020302">
    <!-- Connectors sit behind the circular nodes. -->
    <path d="M29.8 29.2 39 38.4" fill="none" stroke="#020302" stroke-width="6" stroke-linecap="round"/>
    <rect x="64.5" y="28" width="6" height="26"/>
    <rect x="27.5" y="62.5" width="21" height="6"/>

    <!-- Upper-left cluster. -->
    <circle cx="27" cy="26" r="7"/>
    <circle cx="43.5" cy="41.5" r="11.5"/>
    <circle cx="47" cy="21.5" r="3.5"/>
    <circle cx="23.5" cy="45.5" r="3.5"/>

    <!-- Right vertical cluster. -->
    <circle cx="67.5" cy="27.5" r="9.5"/>
    <circle cx="67.5" cy="53.5" r="7.5"/>

    <!-- Lower horizontal cluster. -->
    <circle cx="27.5" cy="65.5" r="7.5"/>
    <circle cx="48.5" cy="65.5" r="9.5"/>
    <circle cx="68.5" cy="71.5" r="3.5"/>
  </g>
</svg>
