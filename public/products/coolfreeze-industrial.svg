<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <rect width="160" height="160" rx="12" fill="#F1F5F9" />
  <!-- Refrigerator Body -->
  <rect x="36" y="20" width="88" height="124" rx="4" fill="#334155" />
  <rect x="40" y="24" width="80" height="116" rx="2" fill="#475569" />
  <!-- Upper Compressor / Vent Shroud -->
  <rect x="42" y="26" width="76" height="16" fill="#1E293B" />
  <line x1="48" y1="30" x2="112" y2="30" stroke="#64748B" stroke-width="1.5" />
  <line x1="48" y1="34" x2="112" y2="34" stroke="#64748B" stroke-width="1.5" />
  <line x1="48" y1="38" x2="112" y2="38" stroke="#64748B" stroke-width="1.5" />
  <!-- Digital Temperature Display -->
  <rect x="70" y="29" width="20" height="10" rx="1" fill="#0F172A" />
  <text x="73" y="37" font-family="monospace" font-size="7" fill="#38BDF8" font-weight="bold">3°C</text>
  <!-- Main Solid Stainless Steel Doors -->
  <rect x="42" y="46" width="76" height="42" rx="1" fill="#64748B" />
  <rect x="42" y="92" width="76" height="44" rx="1" fill="#64748B" />
  <!-- Heavy Duty Industrial Latches / Handles -->
  <rect x="108" y="54" width="4" height="26" rx="1" fill="#1E293B" />
  <circle cx="110" cy="58" r="1.5" fill="#E2E8F0" />
  <rect x="108" y="100" width="4" height="26" rx="1" fill="#1E293B" />
  <circle cx="110" cy="104" r="1.5" fill="#E2E8F0" />
  <!-- Brand Plate -->
  <rect x="46" y="52" width="16" height="6" rx="1" fill="#16A34A" />
  <!-- Base Legs -->
  <rect x="44" y="140" width="8" height="6" rx="1" fill="#0F172A" />
  <rect x="108" y="140" width="8" height="6" rx="1" fill="#0F172A" />
</svg>
